# Loads BeamJoy-Revived's bundled races into the production D1 database (see
# scripts/import-bundled.mts). Run it from the Actions tab; re-running only adds races that
# aren't listed yet. Needs repository secrets CLOUDFLARE_API_TOKEN (Account > D1 > Edit) and
# CLOUDFLARE_ACCOUNT_ID.
name: Import bundled races

on:
  workflow_dispatch:
    inputs:
      ref:
        description: BeamJoy-Revived branch, tag or commit
        default: main
        required: true

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: foodcache3/BeamJoy-Revived
          ref: ${{ inputs.ref }}
          path: .bundled/BeamJoy-Revived
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:import-bundled -- .bundled/BeamJoy-Revived .bundled/bundled.sql
      - run: npx wrangler d1 execute DB --remote --yes --file .bundled/bundled.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: >-
          npx wrangler d1 execute DB --remote
          --command "SELECT count(*) AS bundled_routes FROM routes WHERE author_id = 'system:beamjoy-revived'"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
